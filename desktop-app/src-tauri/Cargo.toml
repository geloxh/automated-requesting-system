[package]
name = "ars-desktop-app"
version = "1.0.0"
description = "Desktop shell for the ARS web app"
edition = "2021"

# See https://tauri.app/develop/ for the official getting-started guide.
# This file was hand-written (not generated by `cargo tauri init`, since Rust
# isn't available in the environment this was scaffolded in) — run
# `cargo check` after installing Rust to confirm it resolves cleanly, and
# consult https://tauri.app if any dependency versions need bumping.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ars_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ars-desktop-app"
path = "src/main.rs"

services:

  # ── PHP + Apache ──
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ars_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Only uploads are mounted as a volume — persists files across rebuilds.
      # The project code is baked into the image via COPY in the Dockerfile.
      # DO NOT mount the whole project (. :) here — Windows has lowercase
      # app/helpers/ which would overwrite the correctly-cased image filesystem.
      - uploads_data:/var/www/automated-requesting-system/public/uploads
      - storage_data:/var/www/automated-requesting-system/storage
    networks:
      - ars_net

  # ── MariaDB ──
  db:
    image: mariadb:11
    container_name: ars_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: arsdb
      MARIADB_USER: ars_user
      MARIADB_PASSWORD: ars_pass
    ports:
      - "3307:3306"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ars_net

  # ── phpMyAdmin ──
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ars_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - ars_net

volumes:
  db_data:
  uploads_data:
  storage_data:

networks:
  ars_net:
    driver: bridge